<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#7f1d1d" />
  <title>Chicken Eggs — STAGING</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#7f1d1d;padding:24px;box-sizing:border-box}
    .boot{max-width:460px;text-align:center;background:#fff;padding:24px;border-radius:24px;box-shadow:0 15px 40px rgba(127,29,29,.15)}
    .egg{font-size:54px}.boot b{display:block;font-size:20px;margin:10px 0 5px}.boot small{color:#92400e;font-weight:700}
  </style>
</head>
<body>
  <div class="boot" id="stageBoot"><div class="egg">🧪🐔</div><b>Loading TEST / STAGING Farm…</b><small>Live farm data will be read-only. Test changes stay isolated.</small></div>
  <script>
    (()=>{
      "use strict";
      const stamp=Date.now();
      const root="../";
      const scriptTag=(src,attrs="")=>"<scr"+"ipt "+attrs+"src=\""+src+"\"></scr"+"ipt>";
      const replaceAsset=(html,file,oldQuery,build)=>html.split(`${file}?${oldQuery}`).join(`${file}?v=${build}`);

      async function boot(){
        const [vr,sbr]=await Promise.all([
          fetch(`${root}app-build.json?t=${stamp}`,{cache:"no-store"}),
          fetch(`staging-build.json?t=${stamp}`,{cache:"no-store"})
        ]);
        if(!vr.ok)throw new Error(`Build manifest HTTP ${vr.status}`);
        if(!sbr.ok)throw new Error(`Staging build manifest HTTP ${sbr.status}`);
        const build=String((await vr.json()).build||stamp);
        const stageBuild=String((await sbr.json()).build||stamp);
        const stageAsset=path=>`${path}?stage=${encodeURIComponent(stageBuild)}&app=${encodeURIComponent(build)}`;
        const sr=await fetch(`${root}app-shell-v1.html?stage=${encodeURIComponent(stageBuild)}&app=${encodeURIComponent(build)}&t=${stamp}`,{cache:"no-store"});
        if(!sr.ok)throw new Error(`App shell HTTP ${sr.status}`);
        let html=await sr.text();

        html=html.replace("<head>","<head><base href=\"../\"><meta name=\"robots\" content=\"noindex,nofollow\">"+scriptTag(stageAsset(`staging/staging-local-seed-v1.js`))+scriptTag(stageAsset(`staging/staging-storage.js`)));
        html=replaceAsset(html,"style.css","v=100",build);
        html=replaceAsset(html,"app2.css","v=1",build);
        html=replaceAsset(html,"firebase.js","v=6",build);
        html=replaceAsset(html,"database.js","v=6",build);
        html=replaceAsset(html,"script.js","v=221",build);
        html=replaceAsset(html,"app2.js","v=1",build);
        html=replaceAsset(html,"inventory.js","v=1",build);
        html=replaceAsset(html,"inventory-ui.js","v=1",build);
        html=replaceAsset(html,"extras-dashboard.js","v=1",build);
        html=replaceAsset(html,"extras-fun.js","v=1",build);

        html=html.replace(`type="module" src="firebase.js?v=${build}"`,`type="module" src="${stageAsset("staging/staging-firebase.js")}"`);
        html=html.replace(`src="database.js?v=${build}"`,`src="${stageAsset("staging/staging-database.js")}"`);
        html=html.replace(`src="app2.js?v=${build}"`,`src="${stageAsset("staging/staging-app2.js")}"`);
        html=html.replace(`src="extras-fun.js?v=${build}"`,`src="${stageAsset("staging/staging-extras-fun.js")}"`);
        html=html.replace("<title>Chicken Eggs</title>","<title>Chicken Eggs — STAGING</title>");
        html=html.replace("</body>",scriptTag(stageAsset(`customer-public-builder-v1.js`))+scriptTag(stageAsset(`customer-public-builder-v2.js`))+scriptTag(stageAsset(`customer-public-builder-v3.js`))+scriptTag(stageAsset(`complete-safety-backup-v3.js`))+scriptTag(stageAsset(`staging/staging-manual-snapshots.js`))+scriptTag(stageAsset(`staging/staging-banner.js`))+scriptTag(stageAsset(`staging/staging-customer-preview-guard-v1.js`))+scriptTag(stageAsset(`staging/staging-business-refresh-v1.js`))+scriptTag(stageAsset(`staging/staging-business-suite-v1.js`))+scriptTag(stageAsset(`staging/staging-farm-manager-v1.js`))+scriptTag(stageAsset(`staging/staging-business-settings-v2.js`))+scriptTag(stageAsset(`staging/staging-midnight-polish-v1.js`))+scriptTag(stageAsset(`staging/staging-sale-stock-guard-v1.js`))+scriptTag(stageAsset(`staging/staging-live-firebase-probe-v1.js`))+scriptTag(stageAsset(`staging/staging-read-budget-v1.js`))+scriptTag(stageAsset(`staging/staging-full-test.js`))+scriptTag(stageAsset(`staging/staging-oversell-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-full-test-v2.js`))+scriptTag(stageAsset(`staging/staging-full-test-v3.js`))+scriptTag(stageAsset(`staging/staging-business-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-farm-manager-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-business-settings-regression-v2.js`))+scriptTag(stageAsset(`staging/staging-full-test-v4.js`))+scriptTag(stageAsset(`staging/staging-reservation-regression-v2.js`))+scriptTag(stageAsset(`staging/staging-bird-sales-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-fun-race-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-complete-backup-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-cross-device-sync-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-12-pack-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-history-back-regression-v1.js`))+scriptTag(stageAsset(`staging/staging-backup-test.js`))+"</body>");

        if(html.includes(`type="module" src="firebase.js?v=${build}"`))throw new Error("Safety stop: live firebase.js remained in staging shell");
        if(html.includes(`src="database.js?v=${build}"`))throw new Error("Safety stop: live database.js remained in staging shell");
        if(html.includes(`src="app2.js?v=${build}"`))throw new Error("Safety stop: live app2.js remained in staging shell");
        if(html.includes(`src="extras-fun.js?v=${build}"`))throw new Error("Safety stop: live extras-fun.js remained in staging shell");

        window.__ChickenEggsBuild=build;
        window.__ChickenEggsStagingBuild=stageBuild;
        window.__ChickenEggsEnvironment="staging";
        document.open();
        document.write(html);
        document.close();
      }
      boot().catch(error=>{
        console.error("STAGING boot failed:",error);
        const el=document.getElementById("stageBoot");
        if(el)el.innerHTML='<div class="egg">🛡️</div><b>Staging did not start</b><small>The live app and live farm data were not changed.</small>';
      });
    })();
  </script>
</body>
</html>
