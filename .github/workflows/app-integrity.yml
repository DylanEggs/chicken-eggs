name: App integrity checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Run app integrity audit
        run: node qa/app-integrity-check.js

      - name: Run inventory authority integration test
        run: node qa/inventory-system-v6-integration.js

      - name: Run staging isolation architecture checks
        run: node qa/staging-isolation-check.js

      - name: Run staging shell transform check
        run: node qa/staging-shell-transform-check.js

      - name: Run destructive staging isolation test
        run: node qa/staging-isolation-integration.js

      - name: Verify live GitHub Pages deployment
        run: node qa/live-pages-smoke.js

      - name: Verify staging GitHub Pages deployment
        run: node qa/staging-live-smoke.js

      - name: Run Who Owes regression test
        run: node qa/who-owes-check.js
