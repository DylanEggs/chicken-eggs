name: Staging browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'staging/**'
      - 'qa/staging-browser-e2e.mjs'
      - 'qa/staging-controls-e2e.mjs'
      - 'qa/customer-year-browser-e2e.mjs'
      - 'qa/staging-profit-browser-e2e.mjs'
      - '.github/workflows/staging-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run staging app in real Chromium
        id: e2e
        run: node qa/staging-browser-e2e.mjs

      - name: Run visible egg-sale profit regression in real Chromium
        id: profit
        run: node qa/staging-profit-browser-e2e.mjs

      - name: Run manual controls and owner gate in real Chromium
        id: controls
        run: node qa/staging-controls-e2e.mjs

      - name: Run customer yearly forecast in real Chromium
        id: year
        run: node qa/customer-year-browser-e2e.mjs

      - name: Report staging browser status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PROFIT_OUTCOME: ${{ steps.profit.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          YEAR_OUTCOME: ${{ steps.year.outcome }}
        run: |
          if [ "$E2E_OUTCOME" = "success" ] && [ "$PROFIT_OUTCOME" = "success" ] && [ "$CONTROLS_OUTCOME" = "success" ] && [ "$YEAR_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Staging browser E2E + visible profit regression passed"
          else
            STATE=failure
            DESC="Staging browser E2E failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="staging-browser-e2e" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
