name: Staging browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'staging/**'
      - 'qa/staging-browser-e2e.mjs'
      - '.github/workflows/staging-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run staging app in real Chromium
        run: node qa/staging-browser-e2e.mjs
