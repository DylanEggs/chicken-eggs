name: Staging browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'staging/**'
      - 'qa/staging-browser-e2e.mjs'
      - '.github/workflows/staging-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run staging app in real Chromium
        id: e2e
        run: node qa/staging-browser-e2e.mjs

      - name: Report staging browser status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          if [ "$E2E_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Staging browser E2E passed"
          else
            STATE=failure
            DESC="Staging browser E2E failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="staging-browser-e2e" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
