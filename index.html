<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f7a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Chicken Eggs</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5fbf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17351f;padding:24px;box-sizing:border-box}
    .boot{max-width:420px;text-align:center;background:#fff;padding:24px;border-radius:24px;box-shadow:0 15px 40px rgba(24,68,36,.12)}
    .egg{font-size:54px}.boot b{display:block;font-size:20px;margin:10px 0 5px}.boot small{color:#6b7c70;font-weight:700}
  </style>
</head>
<body>
  <div class="boot" id="appBoot"><div class="egg">🥚</div><b>Loading Chicken Eggs…</b><small>Checking the newest farm build.</small></div>
  <script>
    (() => {
      "use strict";
      const FALLBACK_BUILD = "20260816-1680";
      const stamp = Date.now();

      function currentShell(html, build) {
        const replacements = [
          ["style.css?v=100", `style.css?v=${build}`],
          ["app2.css?v=1", `app2.css?v=${build}`],
          ["firebase.js?v=6", `firebase.js?v=${build}`],
          ["database.js?v=6", `database.js?v=${build}`],
          ["script.js?v=221", `script.js?v=${build}`],
          ["app2.js?v=1", `app2.js?v=${build}`],
          ["inventory.js?v=1", `inventory.js?v=${build}`],
          ["inventory-ui.js?v=1", `inventory-ui.js?v=${build}`],
          ["extras-dashboard.js?v=1", `extras-dashboard.js?v=${build}`],
          ["extras-fun.js?v=1", `extras-fun.js?v=${build}`]
        ];
        for (const [oldValue, newValue] of replacements) html = html.split(oldValue).join(newValue);
        return html;
      }

      async function boot() {
        let build = FALLBACK_BUILD;
        try {
          const versionResponse = await fetch(`app-build.json?t=${stamp}`, { cache:"no-store" });
          if (versionResponse.ok) {
            const version = await versionResponse.json();
            if (version?.build) build = String(version.build);
          }
        } catch (error) {
          console.warn("Build manifest check failed; using bundled build:", error);
        }

        const shellResponse = await fetch(`app-shell-v1.html?build=${encodeURIComponent(build)}&t=${stamp}`, { cache:"no-store" });
        if (!shellResponse.ok) throw new Error(`App shell HTTP ${shellResponse.status}`);
        let html = await shellResponse.text();
        html = currentShell(html, build);
        window.__ChickenEggsBuild = build;
        document.open();
        document.write(html);
        document.close();
      }

      boot().catch(error => {
        console.error("Chicken Eggs boot failed:", error);
        const box = document.getElementById("appBoot");
        if (box) box.innerHTML = '<div class="egg">🐔</div><b>Could not load the app yet</b><small>Your farm data was not changed. Check your internet connection, then close and reopen Chicken Eggs.</small>';
      });
    })();
  </script>
</body>
</html>
