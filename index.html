<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f7a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Chicken Eggs</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5fbf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17351f;padding:24px;box-sizing:border-box}
    .boot{max-width:420px;text-align:center;background:#fff;padding:24px;border-radius:24px;box-shadow:0 15px 40px rgba(24,68,36,.12)}
    .egg{font-size:54px}.boot b{display:block;font-size:20px;margin:10px 0 5px}.boot small{color:#6b7c70;font-weight:700}
  </style>
</head>
<body>
  <div class="boot" id="appBoot"><div class="egg">🥚</div><b>Loading Chicken Eggs…</b><small>Opening the current farm app safely.</small></div>
  <script>
    (() => {
      "use strict";
      const BUILD = "20260816-1550";
      const shellUrl = `app-shell-v1.html?build=${BUILD}`;

      function currentShell(html) {
        const replacements = [
          ["style.css?v=100", `style.css?v=${BUILD}`],
          ["app2.css?v=1", `app2.css?v=${BUILD}`],
          ["firebase.js?v=6", `firebase.js?v=${BUILD}`],
          ["database.js?v=6", `database.js?v=${BUILD}`],
          ["script.js?v=221", `script.js?v=${BUILD}`],
          ["app2.js?v=1", `app2.js?v=${BUILD}`],
          ["inventory.js?v=1", `inventory.js?v=${BUILD}`],
          ["inventory-ui.js?v=1", `inventory-ui.js?v=${BUILD}`],
          ["extras-dashboard.js?v=1", `extras-dashboard.js?v=${BUILD}`],
          ["extras-fun.js?v=1", `extras-fun.js?v=${BUILD}`]
        ];
        for (const [oldValue, newValue] of replacements) html = html.split(oldValue).join(newValue);
        return html;
      }

      fetch(shellUrl)
        .then(response => {
          if (!response.ok) throw new Error(`App shell HTTP ${response.status}`);
          return response.text();
        })
        .then(html => {
          html = currentShell(html);
          document.open();
          document.write(html);
          document.close();
        })
        .catch(error => {
          console.error("Chicken Eggs boot failed:", error);
          const box = document.getElementById("appBoot");
          if (box) box.innerHTML = '<div class="egg">🐔</div><b>Could not load the app yet</b><small>Your farm data was not changed. Check your internet connection, then close and reopen Chicken Eggs.</small>';
        });
    })();
  </script>
</body>
</html>
